name: Check upstream sources

on:
  schedule:
    - cron: '0 9 * * 1'  # Weekly, Monday at 09:00 UTC
  workflow_dispatch: {}   # Allow manual trigger

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for upstream changes
        id: check
        run: |
          changed=""
          while IFS=' ' read -r name url; do
            current=$(git ls-remote "$url" HEAD | cut -f1)
            stored=$(jq -r ".[\"$name\"] // \"none\"" .upstream-shas.json 2>/dev/null || echo "none")
            if [ "$current" != "$stored" ]; then
              changed="${changed}- **${name}**: \`${stored:0:8}\` → \`${current:0:8}\` ([diff](${url%.git}/compare/${stored:0:12}...${current:0:12}))\n"
            fi
          done < <(python3 -c "
          import yaml
          c = yaml.safe_load(open('sources.yaml'))
          for name, s in c.get('sources', {}).items():
              if s.get('enabled', True):
                  print(f\"{name} {s['url']}\")
          ")
          if [ -n "$changed" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "summary<<EOF" >> "$GITHUB_OUTPUT"
            echo -e "$changed" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue if changes detected
        if: steps.check.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'upstream-change',
              state: 'open',
            });
            if (existing.data.length > 0) {
              // Update existing issue instead of creating a new one
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `## Upstream changes detected (${new Date().toISOString().slice(0,10)})\n\n${{ steps.check.outputs.summary }}\n\nRun \`make all\` locally and cut a release when ready.`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Upstream sources have changed — new release needed',
                body: `## Upstream changes detected\n\n${{ steps.check.outputs.summary }}\n\nRun \`make all\` locally, review output, then tag and release.\n\n\`\`\`sh\nmake distclean && make all\n# review output/\ngh release create v$(date +%Y%m%d)01 output/proton-*-api-*.json --title "v$(date +%Y%m%d)01"\n\`\`\``,
                labels: ['upstream-change'],
              });
            }
